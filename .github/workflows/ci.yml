name: CI

# Corre en cada push a main y en cada PR. Antes no existía ningún CI: el lint
# y los tests solo corrían si alguien se acordaba de tipearlos, y Vercel
# despliega sin ejecutar ninguno de los dos. Un .md del banco mal formado
# llegaba a producción sin que nada lo frenara.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24: los tests corren con `node --test` sobre TypeScript
          # directo, que necesita el type stripping de 22.6 en adelante.
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Pantallas del alumno en celular (desbordes + axe con trinquete), sobre el servidor de
      # produccion del build de arriba. Sin comparacion de capturas: las referencias dependen del
      # sistema operativo (en Linux las fuentes se dibujan distinto). Las rutas con sesion se
      # saltan solas: el login de desarrollo no existe en produccion.
      - name: Navegador para las pruebas de pantallas
        run: npx playwright install --with-deps chromium

      - name: Pantallas en celular
        run: npm run test:pantallas
