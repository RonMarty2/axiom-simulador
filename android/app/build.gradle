apply plugin: 'com.android.application'

android {
    namespace 'com.axiom.simulador'
    compileSdk 34

    defaultConfig {
        applicationId "com.axiom.simulador"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Trusted Web Activity: la librería oficial de Google que convierte la
    // PWA (ya andando en axiom-simulador.vercel.app) en una app Android real,
    // sin barra de navegador, indistinguible de una app nativa para el
    // usuario. No requiere código Kotlin/Java propio — LauncherActivity ya
    // viene resuelta por la librería (ver AndroidManifest.xml).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
